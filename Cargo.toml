[package]
name = "fir_decimator"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "fir_decimator"
crate-type = ["cdylib"]

[dependencies]
cblas = "0.5.0"
# blas = "0.23.0"
# intel-mkl-src = { version = "0.8.1", features = ["mkl-dynamic-lp64-seq"] }
# blas-src = { version = "0.14", features = ["openblas"] }
numpy = "0.27.0"
openblas-src = { version = "0.10.13", features = ["system"] }
pyo3 = { version = "0.27.0", features = ["extension-module"] }
