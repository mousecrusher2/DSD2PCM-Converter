[package]
name = "fir_decimator"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "fir_decimator"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.27.0"
pyo3 = { version = "0.27.0", features = ["extension-module"] }

[profile.release]
debug = true
strip = false
lto = "thin"
codegen-units = 1
